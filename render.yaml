services:
  - type: web
    name: gatekeeper-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python gatekeeper_agent.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MACRODROID_SMS_WEBHOOK
        sync: false
